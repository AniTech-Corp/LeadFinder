<div class="flex flex-col gap-6 max-w-[1600px] mx-auto w-full pb-10">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <h2 class="font-bold text-2xl text-slate-800">Database Prospek Tersimpan</h2>
            <p class="text-slate-500 font-medium text-sm mt-1">Semua data prospek hasil pencarian yang telah tersimpan secara otomatis.</p>
        </div>
        <div class="flex gap-3">
            <button id="dbExportBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors">
                <i class="ri-file-excel-2-fill"></i> Download Semua Data (Excel)
            </button>
        </div>
    </div>

    <!-- TABLE AREA -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col flex-1 overflow-hidden min-h-[500px]">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <i class="ri-search-line absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="dbSearchInput" placeholder="Cari nama UMKM atau kategori..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-[13px] font-medium focus:outline-none focus:border-blue-500 w-80 placeholder:text-slate-400 shadow-sm">
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm font-bold text-slate-600">
                Total Data: <span id="dbTotalCount" class="text-primary text-lg">0</span>
            </div>
        </div>
        
        <div class="overflow-x-auto flex-1">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-[11px] font-bold text-slate-500 border-b border-slate-200 uppercase tracking-wider">
                        <th class="py-4 px-5 w-12 text-center">No</th>
                        <th class="py-4 px-5">Nama UMKM</th>
                        <th class="py-4 px-5">Kategori</th>
                        <th class="py-4 px-5 w-64">Alamat</th>
                        <th class="py-4 px-5">No. Telepon</th>
                        <th class="py-4 px-5">Instagram</th>
                        <th class="py-4 px-5 text-center">Skor</th>
                        <th class="py-4 px-5">Prioritas</th>
                        <th class="py-4 px-5">Status</th>
                        <th class="py-4 px-5 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dbTableBody" class="text-[13px] font-medium text-slate-600 divide-y divide-slate-100">
                    <tr>
                        <td colspan="10" class="p-16 text-center text-slate-400">
                            <i class="ri-loader-4-line animate-spin text-3xl text-primary block mb-3"></i>
                            Memuat data dari database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
